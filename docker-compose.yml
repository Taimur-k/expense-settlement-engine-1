version: "3.9"

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ese_postgres
    environment:
      POSTGRES_DB:       expense_engine
      POSTGRES_USER:     ese_user
      POSTGRES_PASSWORD: ese_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ese_user -d expense_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ese_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── API Server ───────────────────────────────────────────────────────────────
  api:
    build: .
    container_name: ese_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ese_user:ese_password@postgres:5432/expense_engine
      REDIS_URL:    redis://redis:6379/0
      ENV:          production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uvicorn api.main:app
        --host 0.0.0.0
        --port 8000
        --workers 4
        --log-level info

volumes:
  postgres_data:

